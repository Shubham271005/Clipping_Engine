<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Studio · Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="login">
    <form class="card" id="f">
      <div class="card-b stack">
        <div class="brand" style="padding:0">
          <div class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg></div>
          <div>Clip Studio<small>Sign in to continue</small></div>
        </div>
        <div class="field">
          <label for="pw">Dashboard password</label>
          <input class="input" type="password" id="pw" autocomplete="current-password" autofocus required>
        </div>
        <div class="callout bad" id="err" hidden></div>
        <button class="btn primary" type="submit" id="go">Sign in</button>
      </div>
    </form>
  </div>
  <footer style="position:fixed;left:0;right:0;bottom:0;padding:14px 16px;text-align:center;font-size:12.5px;color:#8a8a94">
    <span style="display:inline-flex;align-items:center;gap:6px;vertical-align:middle">
      <svg width="18" height="13" viewBox="0 0 24 17" aria-hidden="true"><rect width="24" height="17" rx="4" fill="#ff0000"/><path d="M9.6 4.8l6.2 3.7-6.2 3.7z" fill="#fff"/></svg>
      This app uses YouTube API Services</span>
    &nbsp;·&nbsp; <a href="/privacy" style="color:#a99cff">Privacy Policy</a>
    &nbsp;·&nbsp; <a href="/terms" style="color:#a99cff">Terms of Service</a>
    &nbsp;·&nbsp; <a href="https://www.youtube.com/t/terms" style="color:#a99cff" rel="noopener">YouTube Terms</a>
  </footer>
  <script src="/config.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('go'), err = document.getElementById('err');
      btn.classList.add('loading'); err.hidden = true;
      const apiBase = String(window.CLIP_STUDIO_API_URL || '').replace(/\/$/, '');
      const r = await fetch(`${apiBase}/api/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ password: document.getElementById('pw').value }) });
      btn.classList.remove('loading');
      if (r.ok) location.href = '/'; else { err.textContent = 'Wrong password.'; err.hidden = false; }
    });
  </script>
</body>
</html>
